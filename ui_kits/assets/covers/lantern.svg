<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Hutan gelap dengan lentera kecil di antara pepohonan">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1f1b"/>
      <stop offset=".55" stop-color="#173029"/>
      <stop offset="1" stop-color="#0a1613"/>
    </linearGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a7c4ae" stop-opacity="0"/>
      <stop offset=".55" stop-color="#a7c4ae" stop-opacity=".22"/>
      <stop offset="1" stop-color="#a7c4ae" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffd79a" stop-opacity=".9"/>
      <stop offset=".35" stop-color="#f0b96d" stop-opacity=".35"/>
      <stop offset="1" stop-color="#f0b96d" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="blur2"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".16"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#night)"/>
  <ellipse cx="800" cy="470" rx="700" ry="210" fill="url(#mist)" filter="url(#blur)"/>
  <g fill="#07100d" opacity=".92">
    <path d="M120 900 L160 250 L205 250 L242 900 Z"/>
