      <rect x="-9" y="-18" width="18" height="6" rx="2" fill="#241a0f"/>
      <path d="M-16 -12 L16 -12 L22 34 L-22 34 Z" fill="#d9a465" opacity=".9"/>
      <path d="M-16 -12 L16 -12 L18 2 L-18 2 Z" fill="#f7d9a5" opacity=".85"/>
      <rect x="-24" y="34" width="48" height="7" rx="3" fill="#241a0f"/>
    </g>
    <g transform="translate(856 508) scale(.64)">
      <rect x="-9" y="-18" width="18" height="6" rx="2" fill="#241a0f"/>
      <path d="M-16 -12 L16 -12 L22 34 L-22 34 Z" fill="#d9a465" opacity=".85"/>
      <path d="M-16 -12 L16 -12 L18 2 L-18 2 Z" fill="#f7d9a5" opacity=".8"/>
