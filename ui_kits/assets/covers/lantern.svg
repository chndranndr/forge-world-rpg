    <path d="M1410 900 L1442 240 L1488 240 L1514 900 Z"/>
  </g>
  <g stroke="#0a1612" stroke-width="9" fill="none" opacity=".85">
    <path d="M160 330 q80 -60 150 -20"/><path d="M330 420 q-60 -80 -140 -30"/>
    <path d="M500 370 q100 -50 160 10"/><path d="M1100 350 q-90 -70 -170 -10"/>
    <path d="M1260 410 q80 -60 150 -10"/><path d="M1450 330 q-70 -70 -150 -20"/>
  </g>
  <path d="M690 900 q90 -210 130 -330 q30 -92 -8 -168" fill="none" stroke="#42513f" stroke-width="70" opacity=".35" filter="url(#blur2)"/>
  <ellipse cx="792" cy="472" rx="300" ry="220" fill="url(#glow)" opacity=".8" filter="url(#blur)"/>
  <g>
