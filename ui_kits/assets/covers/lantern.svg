      <path d="M-16 -12 L16 -12 L22 34 L-22 34 Z" fill="#d9a465" opacity=".8"/>
      <path d="M-16 -12 L16 -12 L18 2 L-18 2 Z" fill="#f7d9a5" opacity=".75"/>
      <rect x="-24" y="34" width="48" height="7" rx="3" fill="#241a0f"/>
    </g>
  </g>
  <path d="M0 830 q240 -40 470 -8 q260 38 520 -12 q300 -50 610 6 L1600 900 L0 900 Z" fill="#07110e" opacity=".9"/>
