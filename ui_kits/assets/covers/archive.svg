  </g>
  <ellipse cx="820" cy="330" rx="420" ry="300" fill="url(#lamp)" opacity=".14" filter="url(#blur)"/>
  <g>
    <path d="M820 120 L820 250" stroke="#0e0c09" stroke-width="5"/>
    <path d="M772 250 L868 250 L900 320 L740 320 Z" fill="#2b2118"/>
    <path d="M772 250 L868 250 L880 280 L760 280 Z" fill="#6e4e2e" opacity=".8"/>
    <ellipse cx="820" cy="320" rx="80" ry="14" fill="#ffd79c" opacity=".7" filter="url(#blur2)"/>
  </g>
  <rect y="760" width="1600" height="140" fill="#1b1510"/>
  <ellipse cx="820" cy="820" rx="420" ry="150" fill="url(#pool)" opacity=".55" filter="url(#blur)"/>
  <g fill="#f2e3c6" opacity=".8">
    <rect x="700" y="760" width="250" height="14" rx="2" transform="rotate(-3 700 760)"/>
    <rect x="724" y="780" width="230" height="12" rx="2" transform="rotate(2 724 780)"/>
    <rect x="742" y="800" width="200" height="10" rx="2" transform="rotate(-2 742 800)"/>
  </g>
  <g stroke="#6b5438" stroke-width="5" opacity=".8">
    <path d="M690 762 L672 850"/><path d="M948 770 L960 852"/>
  </g>
  <circle cx="806" cy="812" r="6" fill="#d9a465"/><circle cx="848" cy="824" r="4" fill="#d9a465"/>
  <rect width="1600" height="900" filter="url(#grain)" opacity=".55"/>
  <rect width="1600" height="900" fill="none" stroke="#0b0907" stroke-width="46" opacity=".4"/>
</svg>
