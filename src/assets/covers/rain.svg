<svg xmlns="http://www.w3.org/2000/svg" viewBox="125 0 1350 900" role="img" aria-label="Atap kota di bawah hujan dengan jendela-jendela hangat">
  <defs>
    <linearGradient id="rsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d3a44"/>
      <stop offset=".55" stop-color="#44525a"/>
      <stop offset="1" stop-color="#6a6d6b"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#25333a"/>
      <stop offset="1" stop-color="#141e23"/>
    </linearGradient>
    <radialGradient id="window" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffdcaa" stop-opacity=".9"/>
      <stop offset="1" stop-color="#e8ad68" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".12"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#rsky)"/>
