    <rect x="500" y="734" width="40" height="48" rx="2" fill="#e7b576" opacity=".75"/>
    <ellipse cx="1080" cy="716" rx="95" ry="70" fill="url(#window)" opacity=".5"/>
    <rect x="1058" y="686" width="44" height="54" rx="2" fill="#e7b576" opacity=".7"/>
    <ellipse cx="1420" cy="770" rx="70" ry="54" fill="url(#window)" opacity=".4"/>
    <rect x="1402" y="746" width="34" height="42" rx="2" fill="#e7b576" opacity=".65"/>
  </g>
  <g stroke="#b9c8cd" stroke-width="1.4" opacity=".3">
