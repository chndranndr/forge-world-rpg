<svg xmlns="http://www.w3.org/2000/svg" viewBox="125 0 1350 900" role="img" aria-label="Jalan sunyi melintasi padang pasir menuju mesa">
  <defs>
    <linearGradient id="dsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9b6a2"/>
      <stop offset=".45" stop-color="#e0c39a"/>
      <stop offset=".78" stop-color="#efd9b6"/>
      <stop offset="1" stop-color="#f3e3c6"/>
    </linearGradient>
    <linearGradient id="dune1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c79a68"/>
      <stop offset="1" stop-color="#a46f46"/>
    </linearGradient>
    <linearGradient id="dune2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9e6c45"/>
      <stop offset="1" stop-color="#71482f"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a4534"/>
      <stop offset="1" stop-color="#2b211a"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff2cf" stop-opacity=".95"/>
      <stop offset=".6" stop-color="#f8dca8" stop-opacity=".4"/>
      <stop offset="1" stop-color="#f8dca8" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".12"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#dsky)"/>
