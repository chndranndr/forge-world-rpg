  <path d="M0 566 q240 -48 470 -6 q260 46 520 -4 q300 -46 610 8 L1600 900 L0 900 Z" fill="url(#dune1)"/>
  <path d="M0 700 q260 -74 520 -16 q270 60 540 2 q260 -54 540 18 L1600 900 L0 900 Z" fill="url(#dune2)"/>
